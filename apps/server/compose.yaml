services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kpi
      POSTGRES_PASSWORD: kpi
      POSTGRES_DB: kpi_schedule
    ports:
      - "5435:5432"
    volumes:
      - kpi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpi -d kpi_schedule"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kpi_pg_data:
